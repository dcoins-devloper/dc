name: Mini App migration checks

on:
  push:
    branches:
      - feature/complete-miniapp-migration
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python bot
        run: python -m py_compile bot.py
      - name: Check Mini App JavaScript syntax
        run: node --check miniapp/app.js
